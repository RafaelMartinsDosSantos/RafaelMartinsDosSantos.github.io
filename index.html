<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Perfil Dev</title>
<meta name="description" content="Portfólio e perfil de desenvolvedor(a)">
<style>
:root{
  --bg:#0b0d17; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12);
  --text:#e8eaf6; --muted:#9aa3c7;
  --a1:#7c5cff; --a2:#00d4ff; --a3:#ff5ca8;
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  line-height:1.6;
}

/* ---------- Fundo animado (aurora) ---------- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 18s ease-in-out infinite}
.aurora span:nth-child(1){width:520px;height:520px;background:var(--a1);top:-120px;left:-100px}
.aurora span:nth-child(2){width:460px;height:460px;background:var(--a2);bottom:-140px;right:-80px;animation-delay:-6s}
.aurora span:nth-child(3){width:380px;height:380px;background:var(--a3);top:40%;left:55%;animation-delay:-12s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.12)}66%{transform:translate(-40px,70px) scale(.95)}}
.grid-bg{position:fixed;inset:0;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 75%)}

.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px}

/* ---------- Cabeçalho / hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;
  padding:36px;border-radius:28px;background:var(--card);border:1px solid var(--card-b);
  backdrop-filter:blur(18px);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.avatar{position:relative;width:170px;height:170px}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));animation:spin 5s linear infinite}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  background:inherit;filter:blur(18px);opacity:.6;z-index:-1;
  background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar .img{position:absolute;inset:0;border-radius:50%;background:#1a1d33 center/cover;border:5px solid var(--bg);z-index:1;
  display:grid;place-items:center;font-size:56px;font-weight:700;color:var(--a2)}
.status{position:absolute;right:8px;bottom:10px;z-index:2;width:30px;height:30px;border-radius:50%;
  background:#0b0d17;display:grid;place-items:center;font-size:16px;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-4deg)}}

.hello{color:var(--a2);font-weight:600;letter-spacing:.08em;font-size:.85rem;text-transform:uppercase}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:6px 0;
  background:linear-gradient(90deg,#fff,var(--a2) 60%,var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.handle{color:var(--muted);font-size:1.05rem}
.role{font-size:1.25rem;margin:14px 0 8px;min-height:1.9em}
.role .typed{color:var(--a3);font-weight:600}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--a3);vertical-align:-.15em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio-short{color:var(--muted);max-width:56ch}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid var(--card-b);font-size:.88rem;color:var(--text);text-decoration:none;transition:.25s}
a.chip:hover{transform:translateY(-3px);border-color:var(--a2);box-shadow:0 8px 24px -8px var(--a2)}

/* ---------- Abas ---------- */
.tabs{position:relative;display:flex;gap:6px;margin:34px 0 26px;padding:6px;border-radius:16px;
  background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(18px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:1;min-width:max-content;padding:12px 18px;border:0;background:none;color:var(--muted);
  font:600 .95rem inherit;font-family:inherit;cursor:pointer;border-radius:11px;transition:color .25s;white-space:nowrap}
.tab:hover{color:#fff}
.tab.active{color:#fff}
.indicator{position:absolute;z-index:0;top:6px;bottom:6px;left:0;border-radius:11px;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 28px -8px var(--a1);
  transition:transform .45s cubic-bezier(.3,1.2,.4,1),width .45s cubic-bezier(.3,1.2,.4,1)}

.panel{display:none}
.panel.active{display:block;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}

.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:26px;backdrop-filter:blur(14px)}
.card h2{font-size:1.15rem;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.card h2 i{font-style:normal}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

/* ---------- Estatísticas ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
.stat{padding:22px;border-radius:var(--radius);background:var(--card);border:1px solid var(--card-b);text-align:center;
  transition:.3s;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--a1),var(--a2));opacity:0;transition:.3s}
.stat:hover{transform:translateY(-6px)}
.stat:hover::before{opacity:.12}
.stat b{position:relative;display:block;font-size:2.3rem;line-height:1.1;
  background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{position:relative;color:var(--muted);font-size:.88rem}

/* ---------- Linguagens ---------- */
.lang-layout{display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:center}
.donut{position:relative;width:240px;height:240px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:26;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .center b{font-size:2rem}
.donut .center span{color:var(--muted);font-size:.8rem}
.lang-row{margin-bottom:15px}
.lang-row .top{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:6px}
.lang-row .top .n{display:flex;align-items:center;gap:9px;font-weight:600}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 10px currentColor}
.lang-row .top .p{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite 1.4s}
@keyframes shine{to{transform:translateX(100%)}}
.stack-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:22px;background:rgba(255,255,255,.08)}
.stack-bar i{height:100%;width:0;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}

/* ---------- Repositórios ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.search{flex:1;min-width:200px;padding:12px 16px;border-radius:12px;border:1px solid var(--card-b);background:var(--card);color:var(--text);font:inherit;outline:none;transition:.25s}
.search:focus{border-color:var(--a2);box-shadow:0 0 0 4px rgba(0,212,255,.15)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.f{padding:8px 14px;border-radius:99px;border:1px solid var(--card-b);background:var(--card);color:var(--muted);cursor:pointer;font:inherit;font-size:.85rem;transition:.25s}
.f:hover{color:#fff;border-color:var(--a2)}
.f.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.repo{display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:var(--radius);background:var(--card);border:1px solid var(--card-b);
  text-decoration:none;color:inherit;transition:transform .25s ease,border-color .25s,box-shadow .25s;
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transform-style:preserve-3d}
.repo:hover{border-color:var(--a2);box-shadow:0 18px 40px -18px var(--a2)}
.repo h3{font-size:1.05rem;display:flex;align-items:center;gap:8px;color:#fff}
.repo p{color:var(--muted);font-size:.9rem;flex:1}
.repo .foot{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);align-items:center}
.empty{text-align:center;color:var(--muted);padding:40px}

/* ---------- Autobiografia ---------- */
.bio-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.bio-text p{margin-bottom:14px;color:#cfd4f0}
.bio-text p:first-of-type::first-letter{font-size:3rem;float:left;line-height:.9;padding:6px 10px 0 0;color:var(--a2);font-weight:700}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--a2),var(--a1),transparent)}
.tl{position:relative;margin-bottom:22px;opacity:0;transform:translateX(-14px);animation:slidein .6s ease forwards}
.tl::before{content:"";position:absolute;left:-26px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--a2);box-shadow:0 0 14px var(--a2)}
.tl small{color:var(--a2);font-weight:600;letter-spacing:.05em}
.tl b{display:block}
.tl span{color:var(--muted);font-size:.9rem}
@keyframes slidein{to{opacity:1;transform:none}}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.tags span{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--card-b);font-size:.9rem;transition:.25s}
.tags span:hover{transform:translateY(-3px) rotate(-2deg);border-color:var(--a3)}

.notice{margin-top:14px;font-size:.8rem;color:var(--muted);text-align:center}
.notice.warn{color:#ffd166}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:50px}
.skeleton{height:90px;border-radius:var(--radius);background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:28px 20px}
  .meta{justify-content:center}
  .bio-short{margin:0 auto}
  .lang-layout,.bio-grid{grid-template-columns:1fr}
  .donut{margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="grid-bg"></div>

<div class="wrap">

  <!-- ================= HERO ================= -->
  <header class="hero">
    <div class="avatar">
      <div class="img" id="avatar"></div>
      <div class="status" title="Olá!">👋</div>
    </div>
    <div>
      <div class="hello" id="hello">Seja bem-vindo(a)</div>
      <h1 id="name">Seu Nome</h1>
      <div class="handle" id="handle">@seu-usuario</div>
      <div class="role">Sou <span class="typed" id="typed"></span><span class="caret"></span></div>
      <p class="bio-short" id="shortBio"></p>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <!-- ================= ABAS ================= -->
  <nav class="tabs" id="tabs" role="tablist">
    <div class="indicator" id="indicator"></div>
    <button class="tab active" data-tab="overview" role="tab">✨ Visão geral</button>
    <button class="tab" data-tab="languages" role="tab">💻 Linguagens</button>
    <button class="tab" data-tab="repos" role="tab">📦 Repositórios</button>
    <button class="tab" data-tab="about" role="tab">📖 Autobiografia</button>
  </nav>

  <!-- VISÃO GERAL -->
  <section class="panel active" id="overview">
    <div class="stats" id="stats">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <div class="cols">
      <div class="card">
        <h2><i>🔥</i> Linguagens mais usadas</h2>
        <div class="stack-bar" id="stackBar"></div>
        <div id="topLangs"></div>
      </div>
      <div class="card">
        <h2><i>🛠️</i> Ferramentas que eu uso</h2>
        <div class="tags" id="tools"></div>
        <h2 style="margin-top:26px"><i>🎯</i> Foco atual</h2>
        <div class="tags" id="focus"></div>
      </div>
    </div>
  </section>

  <!-- LINGUAGENS -->
  <section class="panel" id="languages">
    <div class="card">
      <h2><i>📊</i> Linguagens em todos os meus repositórios</h2>
      <div class="lang-layout">
        <div class="donut">
          <svg viewBox="0 0 200 200" id="donut"></svg>
          <div class="center"><b id="langCount">0</b><span>linguagens</span></div>
        </div>
        <div id="allLangs"></div>
      </div>
    </div>
  </section>

  <!-- REPOSITÓRIOS -->
  <section class="panel" id="repos">
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="🔎 Buscar repositório...">
      <div class="filters" id="filters"></div>
    </div>
    <div class="repos" id="repoList"></div>
  </section>

  <!-- AUTOBIOGRAFIA -->
  <section class="panel" id="about">
    <div class="bio-grid">
      <div class="card bio-text">
        <h2><i>✍️</i> Minha história</h2>
        <div id="bioText"></div>
      </div>
      <div class="card">
        <h2><i>🧭</i> Minha jornada</h2>
        <div class="timeline" id="timeline"></div>
        <h2 style="margin-top:26px"><i>💜</i> Fora do código</h2>
        <div class="tags" id="hobbies"></div>
      </div>
    </div>
  </section>

  <div class="notice" id="notice"></div>
  <footer>Feito com 💜 e muito café · dados ao vivo via API do GitHub</footer>
</div>

<script>
/* =====================================================================
   ✏️  EDITE AQUI — tudo que é pessoal está neste bloco
   ===================================================================== */
const CONFIG = {
  username: "RafaelMartinsDosSantos",
  name: "Rafael Martins Dos Santos",
  roles: ["Desenvolvedor de Software Backend", "Apaixonado por tecnologia", "Aprendendo e evoluindo todos os dias"],
  shortBio: "Iniciando minha carreira na programação, com foco em desenvolvimento backend e Kotlin.",
  location: "Embu das Artes - SP",
  links: [
    { icon: "💼", label: "LinkedIn", url: "https://www.linkedin.com/in/rafael-martins-dos-santos/" },
    { icon: "✉️", label: "E-mail",   url: "mailto:rafaelmartins3012@gmail.com" }
  ],
  tools: ["Kotlin","GitHub"],
  focus: ["Back-end","Kotlin"],
  hobbies: ["🎮 Jogos","🎵 Músicas","🎬 Filmes"],

  // AUTOBIOGRAFIA: cada item vira um parágrafo
  bio: [
    "Olá, seja bem-vindo! Meu nome é Rafael, tenho 17 anos e estou dando os primeiros passos na área de programação.",
    "Comecei a programar neste ano e pretendo seguir nessa área na minha carreira. Graças ao Instituto Proa, costumo fazer visitas a grandes empresas, o que me ajuda a conhecer de perto como o mercado funciona.",
    "Procuro sempre aprender mais sobre a área e me aperfeiçoar a cada dia."
  ],
  // LINHA DO TEMPO (ano / título / descrição)
  timeline: [
    { year: "2026", title: "Comecei a programar",       text: "Primeiros passos no mundo da programação" },
    { year: "2026", title: "Instituto Proa",            text: "Visitas a grandes empresas para conhecer o mercado" },
    { year: "Hoje", title: "Backend com Kotlin",        text: "Estudando e praticando para me aperfeiçoar a cada dia" },
    { year: "Futuro", title: "Carreira em tecnologia",  text: "Seguir carreira como desenvolvedor backend" }
  ]
};
/* ===================================================================== */

const COLORS = {JavaScript:"#f1e05a",TypeScript:"#3178c6",Python:"#3572A5",Java:"#e76f00",HTML:"#e34c26",CSS:"#7c5cff",SCSS:"#c6538c",
  "C#":"#68b723","C++":"#f34b7d",C:"#9aa3c7",PHP:"#8892bf",Go:"#00add8",Rust:"#dea584",Kotlin:"#A97BFF",Swift:"#f05138",Dart:"#00b4ab",
  Ruby:"#ff4d4d",Shell:"#89e051","Jupyter Notebook":"#f37726",Vue:"#41b883",Dockerfile:"#384d54",PLpgSQL:"#336790",Outros:"#5b6385"};
const FALLBACK = ["#ff5ca8","#00d4ff","#7c5cff","#ffd166","#06d6a0","#ef476f","#118ab2","#f78c6b"];
const colorOf = (l,i) => COLORS[l] || FALLBACK[i % FALLBACK.length];

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const DEMO = {
  user:{ login:CONFIG.username, name:CONFIG.name, avatar_url:"", public_repos:3, followers:4, following:3, html_url:"#", created_at:"2023-01-01" },
  repos:[
    { name:"ProjetoSA3", description:"Projeto acadêmico em Java com Spring e MySQL.", language:"Java", stargazers_count:2, forks_count:1, html_url:"#", updated_at:"2025-06-01", fork:false },
    { name:"meu-portfolio", description:"Meu site pessoal com HTML, CSS e JavaScript.", language:"JavaScript", stargazers_count:0, forks_count:0, html_url:"#", updated_at:"2025-05-12", fork:false },
    { name:"api-estudos", description:"API REST criada durante os estudos de back-end.", language:"Java", stargazers_count:1, forks_count:0, html_url:"#", updated_at:"2025-04-02", fork:false }
  ],
  langs:{ JavaScript:38000, Java:22000, CSS:14000, HTML:12000, SCSS:8000, Python:6000 }
};

let DATA = null, activeLang = "Todos", query = "";

/* ---------- Dados do GitHub ---------- */
async function gh(url){
  const r = await fetch("https://api.github.com"+url,{headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadData(){
  const cacheKey = "ghprofile:"+CONFIG.username;
  try{
    const c = JSON.parse(sessionStorage.getItem(cacheKey)||"null");
    if(c) return c;
  }catch(e){}
  if(!CONFIG.username || CONFIG.username.startsWith("SEU-")) throw new Error("sem-usuario");
  const [user, repos] = await Promise.all([
    gh(`/users/${CONFIG.username}`),
    gh(`/users/${CONFIG.username}/repos?per_page=100&sort=updated`)
  ]);
  const own = repos.filter(r=>!r.fork);
  const langMaps = await Promise.all(own.slice(0,40).map(r=>gh(`/repos/${CONFIG.username}/${r.name}/languages`).catch(()=>({}))));
  const langs = {};
  langMaps.forEach(m=>Object.entries(m).forEach(([k,v])=>langs[k]=(langs[k]||0)+v));
  const out = {user, repos:own, langs};
  try{ sessionStorage.setItem(cacheKey, JSON.stringify(out)); }catch(e){}
  return out;
}

/* ---------- Hero ---------- */
function renderHero(){
  const u = DATA.user;
  const nm = CONFIG.name && !CONFIG.name.startsWith("Seu ") ? CONFIG.name : (u.name || u.login || "Seu Nome");
  $("#name").textContent = nm;
  $("#handle").textContent = "@"+(u.login||CONFIG.username);
  document.title = nm + " · Perfil Dev";
  $("#shortBio").textContent = CONFIG.shortBio || u.bio || "";
  const av = $("#avatar");
  if(u.avatar_url){ av.style.backgroundImage = `url(${u.avatar_url})`; }
  else av.textContent = nm.trim().charAt(0).toUpperCase();
  const meta = [];
  if(CONFIG.location) meta.push(`<span class="chip">📍 ${esc(CONFIG.location)}</span>`);
  if(u.html_url && u.html_url!=="#") meta.push(`<a class="chip" target="_blank" rel="noopener" href="${esc(u.html_url)}">🐙 GitHub</a>`);
  CONFIG.links.forEach(l=>meta.push(`<a class="chip" target="_blank" rel="noopener" href="${esc(l.url)}">${l.icon} ${esc(l.label)}</a>`));
  $("#meta").innerHTML = meta.join("");
}

/* ---------- Digitação ---------- */
function typer(){
  const el = $("#typed"); let i=0,j=0,del=false;
  (function tick(){
    const w = CONFIG.roles[i];
    el.textContent = w.slice(0,j);
    if(!del && j<w.length){ j++; setTimeout(tick,70); }
    else if(!del){ del=true; setTimeout(tick,1600); }
    else if(j>0){ j--; setTimeout(tick,35); }
    else { del=false; i=(i+1)%CONFIG.roles.length; setTimeout(tick,300); }
  })();
}

/* ---------- Estatísticas ---------- */
function renderStats(){
  const u = DATA.user, repos = DATA.repos;
  const stars = repos.reduce((a,r)=>a+(r.stargazers_count||0),0);
  const forks = repos.reduce((a,r)=>a+(r.forks_count||0),0);
  const items = [
    ["📦", u.public_repos ?? repos.length, "Repositórios"],
    ["⭐", stars, "Estrelas"],
    ["🍴", forks, "Forks"],
    ["👥", u.followers ?? 0, "Seguidores"],
    ["💻", Object.keys(DATA.langs).length, "Linguagens"]
  ];
  $("#stats").innerHTML = items.map(([ic,n,l])=>`<div class="stat"><div style="font-size:1.4rem">${ic}</div><b data-n="${n}">0</b><span>${l}</span></div>`).join("");
  $$("#stats b").forEach(b=>{
    const end = +b.dataset.n, t0 = performance.now(), dur = 1200;
    (function step(t){
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      b.textContent = Math.round(end*e);
      if(p<1) requestAnimationFrame(step);
    })(t0);
  });
}

/* ---------- Linguagens ---------- */
function langEntries(){
  const total = Object.values(DATA.langs).reduce((a,b)=>a+b,0) || 1;
  let list = Object.entries(DATA.langs).sort((a,b)=>b[1]-a[1]).map(([name,bytes])=>({name,bytes,pct:bytes/total*100}));
  return list;
}
function rowHTML(l,i){
  const c = colorOf(l.name,i);
  return `<div class="lang-row"><div class="top"><span class="n"><span class="dot" style="background:${c};color:${c}"></span>${esc(l.name)}</span><span class="p">${l.pct.toFixed(1)}%</span></div>
  <div class="track"><div class="fill" data-w="${l.pct}" style="background:${c}"></div></div></div>`;
}
function renderLangs(){
  const all = langEntries();
  if(!all.length){ $("#topLangs").innerHTML = '<div class="empty">Nenhuma linguagem detectada ainda.</div>'; return; }
  const top = all.slice(0,5);
  $("#stackBar").innerHTML = all.slice(0,8).map((l,i)=>`<i data-w="${l.pct}" style="background:${colorOf(l.name,i)}" title="${esc(l.name)}"></i>`).join("");
  $("#topLangs").innerHTML = top.map(rowHTML).join("");
  $("#allLangs").innerHTML = all.map(rowHTML).join("");
  $("#langCount").textContent = all.length;

  // donut
  const R=70, C=2*Math.PI*R; let off=0;
  const segs = all.slice(0,8);
  const rest = all.slice(8).reduce((a,l)=>a+l.pct,0);
  if(rest>0) segs.push({name:"Outros",pct:rest});
  $("#donut").innerHTML = `<circle cx="100" cy="100" r="${R}" stroke="rgba(255,255,255,.07)"/>` +
    segs.map((l,i)=>{
      const len = l.pct/100*C, o = off; off += len;
      return `<circle cx="100" cy="100" r="${R}" stroke="${colorOf(l.name,i)}" stroke-dasharray="0 ${C}" data-len="${len}" data-c="${C}" stroke-dashoffset="${-o}"><title>${esc(l.name)} ${l.pct.toFixed(1)}%</title></circle>`;
    }).join("");
}
function animateBars(scope){
  $$(scope+" .fill, "+scope+" .stack-bar i").forEach(el=>{ el.style.width="0"; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$(scope+" .fill, "+scope+" .stack-bar i").forEach(el=>{ el.style.width = el.dataset.w+"%"; });
    $$(scope+" #donut circle[data-len]").forEach(c=>{
      c.setAttribute("stroke-dasharray","0 "+c.dataset.c);
      requestAnimationFrame(()=>c.setAttribute("stroke-dasharray",`${Math.max(0,c.dataset.len-2)} ${c.dataset.c}`));
    });
  }));
}

/* ---------- Repositórios ---------- */
function renderFilters(){
  const langs = ["Todos", ...new Set(DATA.repos.map(r=>r.language).filter(Boolean))];
  $("#filters").innerHTML = langs.map(l=>`<button class="f ${l===activeLang?"on":""}" data-l="${esc(l)}">${esc(l)}</button>`).join("");
  $$("#filters .f").forEach(b=>b.onclick=()=>{ activeLang=b.dataset.l; renderFilters(); renderRepos(); });
}
function renderRepos(){
  const q = query.toLowerCase();
  const list = DATA.repos.filter(r=>(activeLang==="Todos"||r.language===activeLang) &&
      (!q || r.name.toLowerCase().includes(q) || (r.description||"").toLowerCase().includes(q)));
  if(!list.length){ $("#repoList").innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhum repositório encontrado 🫥</div>'; return; }
  $("#repoList").innerHTML = list.map((r,i)=>{
    const c = colorOf(r.language,i);
    const d = r.updated_at ? new Date(r.updated_at).toLocaleDateString("pt-BR",{month:"short",year:"numeric"}) : "";
    return `<a class="repo" target="_blank" rel="noopener" href="${esc(r.html_url)}" style="animation-delay:${i*60}ms">
      <h3>📁 ${esc(r.name)}</h3>
      <p>${esc(r.description||"Sem descrição por enquanto.")}</p>
      <div class="foot">
        ${r.language?`<span><span class="dot" style="background:${c};color:${c}"></span> ${esc(r.language)}</span>`:""}
        <span>⭐ ${r.stargazers_count||0}</span><span>🍴 ${r.forks_count||0}</span>
        ${d?`<span style="margin-left:auto">${esc(d)}</span>`:""}
      </div></a>`;
  }).join("");
  // efeito 3D ao passar o mouse
  $$(".repo").forEach(card=>{
    card.addEventListener("mousemove",e=>{
      const b = card.getBoundingClientRect();
      const x = (e.clientX-b.left)/b.width-.5, y = (e.clientY-b.top)/b.height-.5;
      card.style.transform = `perspective(700px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-4px)`;
    });
    card.addEventListener("mouseleave",()=>card.style.transform="");
  });
}

/* ---------- Autobiografia ---------- */
function renderAbout(){
  $("#bioText").innerHTML = CONFIG.bio.map(p=>`<p>${esc(p)}</p>`).join("");
  $("#timeline").innerHTML = CONFIG.timeline.map((t,i)=>`<div class="tl" style="animation-delay:${i*150}ms"><small>${esc(t.year)}</small><b>${esc(t.title)}</b><span>${esc(t.text)}</span></div>`).join("");
  $("#hobbies").innerHTML = CONFIG.hobbies.map(h=>`<span>${esc(h)}</span>`).join("");
  $("#tools").innerHTML = CONFIG.tools.map(h=>`<span>${esc(h)}</span>`).join("");
  $("#focus").innerHTML = CONFIG.focus.map(h=>`<span>${esc(h)}</span>`).join("");
}

/* ---------- Abas ---------- */
function moveIndicator(btn){
  const ind = $("#indicator");
  ind.style.width = btn.offsetWidth+"px";
  ind.style.transform = `translateX(${btn.offsetLeft}px)`;
}
function openTab(id){
  $$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===id));
  $$(".panel").forEach(p=>p.classList.toggle("active",p.id===id));
  moveIndicator($(`.tab[data-tab="${id}"]`));
  if(id==="overview") animateBars("#overview");
  if(id==="languages") animateBars("#languages");
  if(id==="about"){ $$(".tl").forEach(t=>{t.style.animation="none";t.offsetHeight;t.style.animation="";}); }
  history.replaceState(null,"","#"+id);
}
$$(".tab").forEach(t=>t.onclick=()=>openTab(t.dataset.tab));
window.addEventListener("resize",()=>moveIndicator($(".tab.active")));
$("#search").addEventListener("input",e=>{ query=e.target.value; renderRepos(); });

/* ---------- Início ---------- */
(async function init(){
  let note = "";
  try{ DATA = await loadData(); }
  catch(e){
    DATA = DEMO;
    note = e.message==="sem-usuario"
      ? "Modo demonstração: coloque seu usuário em CONFIG.username (no início do script) para ver seus dados reais."
      : "Não consegui acessar a API do GitHub agora (limite de requisições ou usuário inexistente). Mostrando dados de exemplo.";
  }
  if(note){ const n=$("#notice"); n.textContent="ℹ️ "+note; n.classList.add("warn"); }
  renderHero(); typer(); renderAbout(); renderStats(); renderLangs(); renderFilters(); renderRepos();
  const start = (location.hash||"#overview").slice(1);
  openTab($$(".tab").some(t=>t.dataset.tab===start)?start:"overview");
  document.fonts && document.fonts.ready.then(()=>moveIndicator($(".tab.active")));
})();
</script>
</body>
